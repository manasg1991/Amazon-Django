{% extends 'amazon/header.html' %}
{% block title %} Login {% endblock %}
{% block 'login-content' %}
<section class="section-content padding-y" style="min-height: 84vh;">

    

    <div class="container">
        <div class="card mx-auto shadow-lg border-0"
             style="max-width: 550px; border-radius: 15px; margin-top: 70px;">

            <div class="card-body p-4 p-md-5">

                <!-- Heading -->
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">Reset Password</h3>

                    {% include 'amazon/alerts.html' %}
                </div>

                <!-- Login Form -->
                <form action="{% url 'resetPassword' %}" method="POST">
                    {% csrf_token %}

                    

                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Enter your password"
                               name="password"
                               autocomplete="current-password"
                               required>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Confirm your password"
                               name="confirm_password"
                               autocomplete="current-password"
                               required>
                    </div>

                    

                    <div class="d-grid">
                        <button type="submit"
                                class="btn btn-primary btn-lg roundedb w-100">
                            Submit
                        </button>
                    </div>

                </form>

                <hr class="my-4">

                <!-- Register Link -->
                <p class="text-center mb-0">
                    Don't have an account?
                    <a href="{% url 'register' %}"
                       class="fw-semibold text-decoration-none">
                        Create Account
                    </a>
                </p>

            </div>
        </div>
    </div>

</section>
{% endblock %}
{% include 'amazon/footer.html' %}
